# Fly.io Configuration for Production Deployment

app = "chat-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "chat.example.com"
  PHX_SERVER = "true"
  ECTO_IPV6 = "true"
  POOL_SIZE = "25"
  ERL_AFLAGS = "-proto_dist inet6_tcp"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false   # Keep alive for WebSocket connections
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50000
    soft_limit = 40000

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
  cpus = 4

[metrics]
  port = 9091
  path = "/metrics"

[[mounts]]
  source = "data"
  destination = "/app/data"

